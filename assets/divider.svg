<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" role="img" aria-label="divider">
<defs>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
<clipPath id="line"><rect x="0" y="4" width="900" height="4" rx="2"/></clipPath>
</defs>
<rect x="0" y="4" width="900" height="4" rx="2" fill="#334155" opacity=".6"/>
<g clip-path="url(#line)"><rect y="4" width="220" height="4" fill="url(#glow)"><animate attributeName="x" from="-220" to="900" dur="3.2s" repeatCount="indefinite"/></rect></g>
</svg>